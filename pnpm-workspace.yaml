packages:
  - 'apps/*'
  - 'packages/*'
# esbuild postinstall'da kendi platform binary'sini kuruyor. Vitest'in
# bağımlılığı; build script'i çalışmazsa test koşmaz.
allowBuilds:
  esbuild: true
  # Next.js'in görsel optimizasyonu. Build script'i çalışmazsa `next build`
  # uyarı verip devam ediyor ama üretimde görsel dönüşümü kapalı kalıyor.
  sharp: true

# GEÇİŞLİ AÇIKLARIN KAPATILMASI (T104).
#
# Üç yüksek şiddetli açık da `next` üzerinden geliyor ve 15.x hattında
# sürüm yükselterek kapanmıyor:
#
#   postcss  next 15.5.24 bunu 8.4.31'e SABİTLİYOR; yama 8.5.18'de.
#            Depoda zaten 8.5.26 var (Tailwind için), yani override
#            yeni bir sürüm getirmiyor, ağacı tek sürüme indiriyor.
#   sharp    next'in kendi aralığı zaten `^0.34.3 || ^0.35.3`, yani
#            yamalı hat DESTEKLENİYOR; pnpm sadece alt sınırı seçmişti.
#
# Next 16'ya çıkmak ikisini de kaynağında çözerdi ama major sürüm
# yükseltmesi; build zamanı bir P2 açığı için orantısız risk. Ayrı görev
# olarak kaydedildi (T105).
overrides:
  postcss: '^8.5.18'
  sharp: '^0.35.3'
